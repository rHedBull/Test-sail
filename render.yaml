# Render Blueprint - One-click deploy for the Architecture Portfolio
# Visit https://render.com/docs/blueprint-spec for more info

services:
  # FastAPI Backend
  - type: web
    name: architecture-portfolio-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
    plan: free

  # Static Frontend
  - type: web
    name: architecture-portfolio-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=31536000
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    plan: free
